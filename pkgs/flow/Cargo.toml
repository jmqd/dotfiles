[package]
name = "flow"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "jm.dev personal CLI"

[[bin]]
name = "flow"
path = "src/main.rs"

[lib]
name = "flow"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
dirs = "7.0"
flate2 = "1.1.10"
fs2 = "0.4"
plist = { version = "1.10", default-features = false }
roxmltree = "0.21"
rusqlite = "0.41"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
walkdir = "2.5"

[target.'cfg(target_os = "macos")'.dependencies]
# Linux reads hwmon directly: sysinfo merges sensors that share a label, which
# drops a second socket's k10temp.
sysinfo = { version = "0.40.1", default-features = false, features = ["component"] }
