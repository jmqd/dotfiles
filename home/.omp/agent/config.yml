symbolPreset: nerd
theme:
  light: light
setupVersion: 2
# GPT-6 Astra is the default across every OMP role.
modelRoles:
  # Primary, planning, and full-agent work use high reasoning.
  default: openai-codex/gpt-6-astra:high
  slow: openai-codex/gpt-6-astra:high
  advisor: openai-codex/gpt-6-astra:high
  plan: openai-codex/gpt-6-astra:high
  task: openai-codex/gpt-6-astra:high

  # The lightweight role uses the requested lower reasoning mode.
  smol: openai-codex/gpt-6-astra:medium
advisor:
  enabled: true
  syncBacklog: "1"
plan:
  defaultOnStartup: false
# Ad-hoc model selections also default to high reasoning.
defaultThinkingLevel: high
textVerbosity: low
codexResets:
  autoRedeem: "yes"
hideThinkingBlock: true
lsp:
  diagnosticsOnEdit: true
  diagnosticsOnWrite: true
tools:
  approvalMode: yolo
  approval:
    delete: prompt
    move: prompt
checkpoint:
  enabled: true
task:
  isolation:
    enabled: true
    merge: patch
isolation:
  backend: auto
dev:
  autoqa: true
  autoqaConsent: granted
