symbolPreset: nerd
theme:
  light: light
setupVersion: 2
# Claude Opus 5.5 is the default across every OMP role.
modelRoles:
  # Startup uses medium reasoning.
  default: anthropic/claude-opus-5-5:medium

  # Planning and full-agent work use high reasoning.
  slow: anthropic/claude-opus-5-5:high
  advisor: anthropic/claude-opus-5-5:high
  plan: anthropic/claude-opus-5-5:high
  task: anthropic/claude-opus-5-5:high

  # The lightweight role also uses medium reasoning.
  smol: anthropic/claude-opus-5-5:medium
advisor:
  enabled: true
  syncBacklog: "1"
plan:
  defaultOnStartup: false
# Ad-hoc model selections also default to high reasoning.
defaultThinkingLevel: high
textVerbosity: low
codexResets:
  autoRedeem: "yes"
hideThinkingBlock: true
lsp:
  diagnosticsOnEdit: true
  diagnosticsOnWrite: true
tools:
  approvalMode: yolo
  approval:
    delete: prompt
    move: prompt
checkpoint:
  enabled: true
task:
  isolation:
    enabled: true
    merge: patch
isolation:
  backend: auto
dev:
  autoqa: true
  autoqaConsent: granted
