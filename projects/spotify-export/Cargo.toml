[package]
name = "spotify-export"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Export a Spotify playlist's track metadata as TSV"

[dependencies]
base64 = "0.23"
getrandom = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "form", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = true
